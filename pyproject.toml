[project]
name = "landcover-domain-shift"
version = "0.1.0"
description = "Diagnosing and fixing land-cover segmentation domain shift (Iowa to Sahel)"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Deep learning
    "torch>=2.1",
    "torchvision>=0.16",
    "segmentation-models-pytorch>=0.3.3",

    # Geospatial / data acquisition
    "earthengine-api>=0.1.390",
    "geemap>=0.30",
    "rasterio>=1.3",
    "geopandas>=0.14",
    "shapely>=2.0",

    # ML / analysis
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "numpy>=1.24",
    "pandas>=2.1",

    # Visualization
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "umap-learn>=0.5",

    # Utilities
    "tqdm>=4.66",
    "Pillow>=10.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.25",
    "ipywidgets>=8.1",
    "notebook>=7.0",
]
